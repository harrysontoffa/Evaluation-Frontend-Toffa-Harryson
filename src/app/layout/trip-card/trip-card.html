<article class="bg-slate-800 rounded-2xl p-6 shadow-lg max-w-sm">


  <div class="flex items-center justify-between">
    <h3 class="text-xl font-bold text-white">{{trip.cityName}}</h3>
    <span class="bg-indigo-500 text-white text-sm font-semibold px-4 py-1 rounded-full">
      {{trip.startDate}}
    </span>
  </div>


  <div class="mt-5 bg-slate-900 rounded-xl p-5 flex items-start justify-between">
    <p class="text-3xl font-bold text-white">{{weather?.temperature}}</p>
    <p class="text-xs text-slate-400">Vent : {{weather?.windSpeed}}</p>
  </div>


  <p class="mt-5 italic text-slate-400">{{ trip.notes}}</p>


  <div class="mt-6 flex justify-end">
    <button (click)="handleDelete()"
      class="border border-rose-500 text-rose-500 text-xs font-semibold px-3 py-1.5 rounded-md hover:bg-rose-500 hover:text-white transition-colors">
      Supprimer
    </button>
  </div>

</article>
