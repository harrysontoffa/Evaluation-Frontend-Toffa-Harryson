<div class="flex min-h-screen items-center justify-center bg-slate-900 p-4">
  <form class="w-full max-w-sm rounded-xl bg-slate-800 p-6 shadow-xl">

    <h2 class="mb-4 text-xl font-bold text-white">Planifier un voyage</h2>


    <div class="mb-4">
      <label for="ville" class="mb-1 block text-sm text-slate-300">Ville</label>
      <input [(ngModel)]="villeRechercher" (ngModelChange)="handleSearch($event)"
        id="ville"
        name="villeRechercher"
        type="text"
        placeholder="Ex: Kyoto"
        class="w-full rounded-md border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-white placeholder-slate-500 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"
      />
      @for(ville of searchResults; track ville.id){
        <button (click)="ChoixVille(ville)"  class="p-3 border" >{{ville.name}}</button>
      }
    </div>


    <div class="mb-4">
      <label for="date" class="mb-1 block text-sm text-slate-300">Date</label>
      <input [(ngModel)]="date"
        id="date"
        type="date"
        name="date"
        class="w-full rounded-md border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-white focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"
      />
    </div>


    <div class="mb-4">
      <label for="notes" class="mb-1 block text-sm text-slate-300">Notes</label>
      <textarea [(ngModel)]="note"
        id="notes"
        name="note"
        rows="4"
        class="w-full resize-none rounded-md border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-white focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"
      ></textarea>
    </div>


    <button
      type="submit"
      disabled
      class="w-full rounded-md bg-slate-700 py-2 text-sm font-semibold text-slate-500 enabled:bg-sky-600 enabled:text-white enabled:hover:bg-sky-500 disabled:cursor-not-allowed"
    >
      Enregistrer
    </button>

  </form>
</div>
