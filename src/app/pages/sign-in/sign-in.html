<div class="flex min-h-screen items-center justify-center bg-slate-900 p-4">
  <form class="w-full max-w-sm rounded-xl bg-slate-800 p-6 shadow-xl">

    <h2 class="text-center text-xl font-bold text-white">Créer un compte</h2>
    <p class="mb-6 mt-2 text-center text-xs text-slate-400">
      Rejoignez-nous en remplissant le formulaire ci-dessous.
    </p>

    <!-- Email -->
    <div class="mb-4">
      <label for="email" class="mb-1 block text-xs font-semibold text-slate-300">
        Adresse Email
      </label>
      <input [(ngModel)]="email"
        id="email"
        name="email"
        type="email"
        placeholder="exemple@email.com"
        class="w-full rounded-md border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
      />
    </div>

    <!-- Mot de passe -->
    <div class="mb-4">
      <label for="password" class="mb-1 block text-xs font-semibold text-slate-300">
        Mot de passe
      </label>
      <input [(ngModel)]="password"
        id="password"
        name="password"
        type="password"
        placeholder="••••••••"
        class="w-full rounded-md border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
      />
    </div>

    <!-- Confirmation -->
    <div class="mb-6">
      <label for="confirm" class="mb-1 block text-xs font-semibold text-slate-300">
        Confirmer le mot de passe
      </label>
      <input [(ngModel)]="confPassword"
        id="confirm"
        name="confPassword"
        type="password"
        placeholder="••••••••"
        class="w-full rounded-md border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
      />
    </div>

    <!-- Bouton -->
    <button (click)="signIn()"
      type="submit"
      class="w-full rounded-md bg-indigo-500 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-400"
    >
      S'inscrire
    </button>

    <!-- Séparateur -->
    <div class="my-5 flex items-center gap-3">
      <div class="h-px flex-1 bg-slate-600"></div>
      <span class="text-xs text-slate-300">OU</span>
      <div class="h-px flex-1 bg-slate-600"></div>
    </div>
        @if (errorMessage()) {
      <p class="text-sm text-rose-400">{{ errorMessage() }}</p>
    }

    <!-- Lien connexion -->
    <p class="text-center text-xs text-slate-300">
      Vous avez déjà un compte ?
      <a   routerLink="/login" class="font-semibold text-indigo-400 underline hover:text-indigo-300">
        Se connecter
      </a>
    </p>

  </form>
</div>
